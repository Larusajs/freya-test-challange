[project]
name = "freya-delivery-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "livekit-agents[elevenlabs,google,silero]>=1.3,<2", "livekit-api>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
